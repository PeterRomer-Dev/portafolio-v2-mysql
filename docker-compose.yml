version: '3.8'

services:
  mysql-general:
    image: mysql:8.0
    container_name: mysql-general
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "Peter046"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_global:/var/lib/mysql

volumes:
  mysql_data_global:
    external: true