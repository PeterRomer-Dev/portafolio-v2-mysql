<!-- el siguiente codigo define la estructura de la página de usuarios registrados -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Registrados</title>
    <style> 
        body { 
            background-color: #121212; 
            color: white; 
            font-family: 'Poppins', sans-serif; 
            padding: 20px; 
            margin: 0;
        }

        
        .table-responsive {
            width: 100%;
            overflow-x: auto; 
            border: 1px solid #D4AF37;
            border-radius: 8px;
            background: #1e1e1e;
            margin-top: 20px;
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            min-width: 600px; 
        }

        th, td { 
            padding: 15px; 
            text-align: left; 
            border-bottom: 1px solid #333; 
        }

        th { 
            color: #D4AF37; 
            border-bottom: 2px solid #D4AF37; 
        }

        tr:hover { background: #252525; }

        
        @media (min-width: 768px) {
            body { padding: 50px; }
        }
    </style>    

</head>
<body>
    <!-- Encabezado con título y botón para cerrar, adaptado para diferentes tamaños de pantalla -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; gap: 10px; flex-wrap: wrap;">
    
        <h2 style="margin: 0;">📋 Usuarios Registrados</h2>

        <a href="/" style="
            color: #D4AF37; 
            text-decoration: none; 
            font-family: 'Poppins', sans-serif; 
            border: 1px solid #D4AF37; 
            padding: 8px 20px; 
            border-radius: 8px;
            font-size: 0.9rem;
            transition: 0.3s;
            
        " onmouseover="this.style.background='#D4AF37'; this.style.color='black';" 
           onmouseout="this.style.background='transparent'; this.style.color='#D4AF37';">
           Cerrar
        </a>
    </div>
    <!-- Tabla responsiva para mostrar la lista de usuarios, con un diseño limpio y moderno -->
    <div class="table-responsive">
        <table> <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Cédula</th>
                    <th>Teléfono</th>
                    <th>Correo</th>
                    <th>Fecha Registro</th>
                </tr>
            </thead>
            <tbody>
                {% for u in lista %}  
                <tr>
                    <td>{{ u[1] }}</td>
                    <td>{{ u[2] }}</td>
                    <td>{{ u[3] }}</td>
                    <td>{{ u[5] }}</td>
                    <td style="color: #888; font-size: 0.85rem;">{{ u[6] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <!-- Enlace para volver al inicio, con un diseño discreto que se integra con el tema oscuro -->
    <div style="margin-top: 20px; text-align: center;">
        <a href="/" style="color: #D4AF37; text-decoration: none; font-size: 0.8rem;">← Volver al inicio</a>
    </div>
</body>
</html>
